<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}The Hacker's Diet{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="wrapper">
  <header>
    <h1><a href="/">The Hacker's Diet <span>Online</span></a></h1>
    <nav>{% block nav %}{% endblock %}</nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Inspired by <em>The Hacker's Diet</em> by John Walker &mdash;
    <a href="/demo">Load demo data</a></p>
  </footer>
</div>
</body>
</html>
