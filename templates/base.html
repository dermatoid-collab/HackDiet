<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}The Hacker's Diet Online{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<table class="title">
<tr>
  <td align="center" valign="top" style="padding:0.5rem 1rem;">
    <span class="title1">The Hacker's Diet <em>Online</em></span><br>
    <span class="title2">How to lose weight and hair through stress and poor nutrition</span>
  </td>
</tr>
</table>

<nav class="navbar">
  <div class="navbar-tabs">
    <a class="navbar-tab {% if active_tab=='log' %}active{% endif %}" href="{{ url_for('index') }}" title="Display the current monthly log">Log</a>
    <a class="navbar-tab {% if active_tab=='history' %}active{% endif %}" href="{{ url_for('year_view', year=current_year) }}" title="Show yearly history">History</a>
    <a class="navbar-tab {% if active_tab=='chart' %}active{% endif %}" href="{{ url_for('chart_view') }}" title="Generate historical charts">Chart</a>
    <a class="navbar-tab {% if active_tab=='trend' %}active{% endif %}" href="{{ url_for('trend_view') }}" title="Analyse weight trend">Trend</a>
    <a class="navbar-tab {% if active_tab=='settings' %}active{% endif %}" href="{{ url_for('settings_view') }}" title="Settings">Settings</a>
  </div>
  <div class="navbar-right">
    <a class="navbar-tab" href="{{ url_for('logout') }}" title="Sign out">Sign&nbsp;Out</a>
  </div>
</nav>

<div id="main">
  {% block content %}{% endblock %}
</div>

<p class="footer">
  Inspired by <em>The Hacker's Diet</em> by John Walker
</p>

</body>
</html>
