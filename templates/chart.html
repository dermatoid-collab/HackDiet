{% extends "base.html" %}

{% block title %}The Hacker's Diet Online: Chart Workshop{% endblock %}

{% block content %}
<h1 class="c">Chart Workshop</h1>

{% if chart_labels %}
<div class="chart-workshop">
  <canvas id="chartCanvas"></canvas>
</div>
{% else %}
<p class="centred">No data for the selected period.</p>
{% endif %}

<form method="post" action="{{ url_for('chart_view') }}">
<p class="centred">
  Last:
  <label><input type="radio" name="period" value="m" {% if period=='m' %}checked{% endif %}> Month</label>
  &nbsp;
  <label><input type="radio" name="period" value="q" {% if period=='q' %}checked{% endif %}> Quarter</label>
  &nbsp;
  <label><input type="radio" name="period" value="h" {% if period=='h' %}checked{% endif %}> Six months</label>
  &nbsp;
  <label><input type="radio" name="period" value="y" {% if period=='y' %}checked{% endif %}> Year</label>
  &nbsp;
  <label><input type="radio" name="period" value="c" {% if period=='c' %}checked{% endif %}> Custom</label>
</p>
<p class="centred">
  From:
  <select name="from_y">
    {% for y in years %}<option value="{{ y }}"{% if custom_from and custom_from.year==y %} selected{% endif %}>{{ y }}</option>{% endfor %}
  </select>
  <select name="from_m">
    {% for m in range(1,13) %}<option value="{{ m }}"{% if custom_from and custom_from.month==m %} selected{% endif %}>{{ "%02d"|format(m) }}</option>{% endfor %}
  </select>
  <select name="from_d">
    {% for d in range(1,32) %}<option value="{{ d }}"{% if custom_from and custom_from.day==d %} selected{% endif %}>{{ "%02d"|format(d) }}</option>{% endfor %}
  </select>
  &nbsp;To:
  <select name="to_y">
    {% for y in years %}<option value="{{ y }}"{% if custom_to and custom_to.year==y %} selected{% elif not custom_to and y==today.year %} selected{% endif %}>{{ y }}</option>{% endfor %}
  </select>
  <select name="to_m">
    {% for m in range(1,13) %}<option value="{{ m }}"{% if custom_to and custom_to.month==m %} selected{% elif not custom_to and m==today.month %} selected{% endif %}>{{ "%02d"|format(m) }}</option>{% endfor %}
  </select>
  <select name="to_d">
    {% for d in range(1,32) %}<option value="{{ d }}"{% if custom_to and custom_to.day==d %} selected{% elif not custom_to and d==today.day %} selected{% endif %}>{{ "%02d"|format(d) }}</option>{% endfor %}
  </select>
  &nbsp;
  <input type="submit" value=" Update ">
  &nbsp;
  <input type="button" value=" Reset " onclick="window.location='{{ url_for('chart_view') }}'">
</p>
</form>

{% if chart_labels %}
<script>
new Chart(document.getElementById('chartCanvas'), {
  type: 'line',
  data: {
    labels: {{ chart_labels | tojson }},
    datasets: [
      {
        label: 'Weight',
        data: {{ chart_weight | tojson }},
        borderColor: '#0000cc',
        backgroundColor: 'rgba(0,0,204,0.07)',
        pointRadius: 2,
        tension: 0.1,
        spanGaps: false,
      },
      {
        label: 'Trend',
        data: {{ chart_trend | tojson }},
        borderColor: '#cc0000',
        backgroundColor: 'transparent',
        pointRadius: 0,
        tension: 0.3,
        spanGaps: true,
        borderWidth: 2,
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { position: 'top' },
      tooltip: {
        callbacks: {
          label: ctx => ctx.dataset.label + ': ' + (ctx.raw != null ? ctx.raw.toFixed(1) + ' kg' : '—')
        }
      }
    },
    scales: {
      x: { ticks: { maxTicksLimit: 16 }, title: { display: true, text: 'Date' } },
      y: { title: { display: true, text: 'kg' } }
    }
  }
});
</script>
{% endif %}
{% endblock %}
